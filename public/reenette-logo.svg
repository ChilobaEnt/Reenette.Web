<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Reenette logo">
  <defs>
    <style>
      .logo-shape { fill: none; stroke: #000; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Left curved shape -->
  <path class="logo-shape" d="M 60 80 Q 60 40, 100 40 L 140 40 L 140 120 Q 100 120, 60 80 Z"/>
  
  <!-- Right curved shape -->
  <path class="logo-shape" d="M 196 80 Q 196 40, 156 40 L 116 40 L 116 120 Q 156 120, 196 80 Z"/>
  
  <!-- Bottom arc -->
  <path class="logo-shape" d="M 60 140 Q 128 200, 196 140"/>
  
  <!-- Center vertical lines -->
  <line class="logo-shape" x1="112" y1="160" x2="112" y2="220"/>
  <line class="logo-shape" x1="144" y1="160" x2="144" y2="220"/>
</svg>
